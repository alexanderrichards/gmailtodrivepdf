[project]
name = "gmailtodrivepdf"
version = "0.1.0"
description = "Convert starred Gmail messages to PDF and optionally upload them to Google Drive"
readme = "README.md"
authors = [
    { name = "Alexander Richards", email = "a.richards@imperial.ac.uk" }
]
requires-python = ">=3.14"
dependencies = [
    "google-api-python-client>=2.201.0",
    "google-auth-httplib2>=0.4.4",
    "google-auth-oauthlib>=1.5.0",
    "playwright>=1.64.1",
    "pypdf>=6.21.4",
    "typer>=0.27.3",
]

[project.scripts]
gmailtodrivepdf = "gmailtodrivepdf.cli:app"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
